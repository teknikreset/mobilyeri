name: SoruBotu

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions ile botu yaklaşık 5 saat 50 dakika çalıştırıp yeniden başlatır.
    - cron: '0 */6 * * *'

concurrency:
  group: sorubotu-running
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      BOT_HOST: ${{ secrets.BOT_HOST || 'sohbet.mobilyeri.com' }}
      BOT_PORT: ${{ secrets.BOT_PORT || '4267' }}
      BOT_ORIGIN: ${{ secrets.BOT_ORIGIN || 'https://sohbet.mobilyeri.com' }}
      BOT_WS_PATH: ${{ secrets.BOT_WS_PATH || '/socket.io/?EIO=4&transport=websocket' }}
      BOT_NICK: ${{ secrets.BOT_NICK || 'SoruBotu' }}
      BOT_GENDER: ${{ secrets.BOT_GENDER || 'e' }}
      BOT_FINGERPRINT: ${{ secrets.BOT_FINGERPRINT || '2718281828459045' }}
      BOT_SCREEN: ${{ secrets.BOT_SCREEN || '1920x1080' }}
      BOT_LOCATION: ${{ secrets.BOT_LOCATION || '38.4_27.1' }}

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Python syntax kontrolü
        run: python -m compileall -q .

      - name: SoruBotu çalıştır
        run: python mobilyeri_sorubotu.py
